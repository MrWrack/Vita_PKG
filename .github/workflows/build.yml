name: Build MrWrack PKG Converter

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-vita:
    name: Build PS Vita VPK
    runs-on: ubuntu-latest

    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show VitaSDK
        run: |
          echo "VITASDK=$VITASDK"
          cmake --version
          arm-vita-eabi-gcc --version

      - name: MRW-PKG format self-test
        run: |
          python3 tools/test_mrw_pkg_v2.py

      - name: Fetch GPL head.bin template
        run: |
          chmod +x scripts/fetch_vitashell_resource.sh
          ./scripts/fetch_vitashell_resource.sh

      - name: Validate LiveArea PNGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          PNG_SIG = b'\x89PNG\r\n\x1a\n'
          bad = []

          def ihdr(path):
              data = path.read_bytes()
              if len(data) < 33 or data[:8] != PNG_SIG:
                  raise ValueError("not a valid PNG")
              if data[12:16] != b'IHDR':
                  raise ValueError("missing IHDR")
              return struct.unpack(">IIBBBBB", data[16:29])[:4]

          # PS Vita-safe LiveArea formats:
          # icon0 / pic0 / bg0: 8-bit indexed PNG, no alpha
          # startup: 8-bit RGBA allowed
          specs = {
              Path("sce_sys/icon0.png"): ((128,128), 8, 3),
              Path("sce_sys/pic0.png"): ((960,544), 8, 3),
              Path("sce_sys/livearea/contents/bg0.png"): ((840,500), 8, 3),
              Path("sce_sys/livearea/contents/startup.png"): ((280,158), 8, 6),
          }

          for path, (size, depth, color_type) in specs.items():
              if not path.exists():
                  bad.append(f"{path}: missing")
                  continue
              try:
                  width, height, bit_depth, actual_type = ihdr(path)
              except Exception as e:
                  bad.append(f"{path}: {e}")
                  continue

              if (width,height) != size:
                  bad.append(f"{path}: {width}x{height}, expected {size[0]}x{size[1]}")
              if bit_depth != depth:
                  bad.append(f"{path}: bit depth {bit_depth}, expected {depth}")
              if actual_type != color_type:
                  bad.append(f"{path}: PNG color type {actual_type}, expected {color_type}")

          template = Path("sce_sys/livearea/contents/template.xml")
          if not template.exists():
              bad.append(f"{template}: missing")

          if bad:
              print("LiveArea PNG validation FAILED:")
              for item in bad:
                  print(" -", item)
              raise SystemExit(1)

          print("LiveArea validation: OK")
          print(" icon0: 128x128 / 8-bit indexed / no alpha")
          print(" pic0: 960x544 / 8-bit indexed / no alpha")
          print(" bg0: 840x500 / 8-bit indexed / no alpha")
          print(" startup: 280x158 / 8-bit RGBA")
          PY

      - name: Check zlib
        run: |
          test -f "$VITASDK/arm-vita-eabi/include/zlib.h"
          echo "zlib header found"

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VPK
        run: |
          cmake --build build --parallel 2

      - name: Verify VPK exists
        run: |
          set -e
          VPK_FILE="$(find build -maxdepth 1 -type f -name '*.vpk' -print -quit)"
          test -n "$VPK_FILE"
          echo "Built VPK: $VPK_FILE"
          ls -lh "$VPK_FILE"
          echo "VPK_FILE=$VPK_FILE" >> "$GITHUB_ENV"

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrWrack-PKG-Converter-v3.5-icon-ui-VPK
          path: ${{ env.VPK_FILE }}
          if-no-files-found: error
          retention-days: 30
