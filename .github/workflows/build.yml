name: Build MrWrack PKG Converter

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-vita:
    name: Build PS Vita VPK
    runs-on: ubuntu-latest

    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show VitaSDK
        run: |
          echo "VITASDK=$VITASDK"
          cmake --version
          arm-vita-eabi-gcc --version

      - name: MRW-PKG format self-test
        run: |
          python3 tools/test_mrw_pkg_v2.py

      - name: Fetch GPL head.bin template
        run: |
          chmod +x scripts/fetch_vitashell_resource.sh
          ./scripts/fetch_vitashell_resource.sh

      - name: Validate LiveArea PNGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          PNG_SIG = b'\x89PNG\r\n\x1a\n'
          bad = []

          def read_png_ihdr(path):
              data = path.read_bytes()
              if len(data) < 33 or data[:8] != PNG_SIG:
                  raise ValueError("not a valid PNG")
              length = struct.unpack(">I", data[8:12])[0]
              ctype = data[12:16]
              if ctype != b'IHDR' or length != 13:
                  raise ValueError("missing/invalid IHDR")
              width, height, bit_depth, color_type, comp, filt, interlace = struct.unpack(
                  ">IIBBBBB", data[16:29]
              )
              return width, height, bit_depth, color_type

          for p in Path("sce_sys").rglob("*.png"):
              try:
                  width, height, bit_depth, color_type = read_png_ihdr(p)
              except Exception as e:
                  bad.append(f"{p}: {e}")
                  continue

              # PNG color type 3 = indexed/palette.
              if color_type != 3:
                  bad.append(
                      f"{p}: PNG color type={color_type}, expected indexed/palette type 3"
                  )

              if p.name == "icon0.png" and (width, height) != (128, 128):
                  bad.append(
                      f"{p}: size={width}x{height}, expected 128x128"
                  )

              if bit_depth not in (1, 2, 4, 8):
                  bad.append(
                      f"{p}: indexed PNG bit depth={bit_depth}, expected 1/2/4/8"
                  )

          if bad:
              print("LiveArea PNG validation FAILED:")
              for item in bad:
                  print(" -", item)
              raise SystemExit(1)

          print("LiveArea PNG validation: OK")
          PY

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VPK
        run: |
          cmake --build build --parallel 2

      - name: Verify VPK exists
        run: |
          set -e
          VPK_FILE="$(find build -maxdepth 1 -type f -name '*.vpk' -print -quit)"
          test -n "$VPK_FILE"
          echo "Built VPK: $VPK_FILE"
          ls -lh "$VPK_FILE"
          echo "VPK_FILE=$VPK_FILE" >> "$GITHUB_ENV"

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrWrack-PKG-Converter-v1.5.6-livearea-spec-fix-VPK
          path: ${{ env.VPK_FILE }}
          if-no-files-found: error
          retention-days: 30
