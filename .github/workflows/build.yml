name: Build MrWrack PKG Converter

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-vita:
    name: Build PS Vita VPK
    runs-on: ubuntu-latest

    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show VitaSDK
        run: |
          echo "VITASDK=$VITASDK"
          cmake --version
          arm-vita-eabi-gcc --version

      - name: MRW-PKG format self-test
        run: |
          python3 tools/test_mrw_pkg_v2.py

      - name: Fetch GPL head.bin template
        run: |
          chmod +x scripts/fetch_vitashell_resource.sh
          ./scripts/fetch_vitashell_resource.sh

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VPK
        run: |
          cmake --build build --parallel 2

      - name: Verify VPK exists
        run: |
          set -e
          VPK_FILE="$(find build -maxdepth 1 -type f -name '*.vpk' -print -quit)"
          test -n "$VPK_FILE"
          echo "Built VPK: $VPK_FILE"
          ls -lh "$VPK_FILE"
          echo "VPK_FILE=$VPK_FILE" >> "$GITHUB_ENV"

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrWrack-PKG-Converter-v1.4.4-workflow-fix-VPK
          path: ${{ env.VPK_FILE }}
          if-no-files-found: error
          retention-days: 30
